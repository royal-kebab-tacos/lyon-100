[build]
  command = "npm run check"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"


[[headers]]
  for = "/routing/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
